<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribune des supporters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;900&family=Chakra+Petch:wght@500;700&family=Press+Start+2P&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: cinq maquettes d'overlay à comparer en un clic, chacune avec son propre caractère.
IDEA: une même tribune, cinq « habillages » : la scène est identique, seul le style change.
PICTURE: la tribune qui se remplit, plein écran, avec un sélecteur de style en haut à droite.
COLOUR and TYPE: chaque style a sa palette et sa police (Bangers, Orbitron, Press Start 2P, Barlow Condensed, Saira Condensed).
LAYOUT: scène fixe 1920x1080 mise à l'échelle ; titre et compteur en haut, tribune sur les trois quarts du bas.
*/
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body.clear{background:transparent}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;inset:0}
#bg svg.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
body.clear #bg{display:none}
#fx{position:absolute;inset:0;z-index:150;pointer-events:none}
#head{position:absolute;left:0;right:0;top:40px;text-align:center;z-index:200;pointer-events:none}
#title{display:inline-block}
#count{display:inline-flex;gap:14px;align-items:center;margin-top:20px}
body.notitle #head{display:none}
.row{position:absolute;left:0;width:1920px}
.step{position:absolute;left:0;right:0}
.seat{position:absolute}
.seat>svg.chair{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
.fan{position:absolute;left:2.5%;width:95%;bottom:8%;transform-origin:50% 100%}
.fan svg{display:block;width:100%;height:auto;overflow:visible}
.fan.lurk svg{opacity:.5;filter:grayscale(1)}
.fan.hop{animation:hop .5s ease-out}
.fan.out{animation:fade .5s ease-in both}
@keyframes hop{40%{transform:translateY(-20%)}70%{transform:scaleY(.93)}}
@keyframes fade{to{opacity:0;transform:translateY(-30%) scale(.6)}}
.tag{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);max-width:124%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.burst{position:absolute;left:50%;bottom:108%;transform:translateX(-50%);z-index:5;pointer-events:none;white-space:nowrap;max-width:380px;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs);animation:pop 4.2s ease both}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.3)}8%{opacity:1;transform:translateX(-50%) scale(1.1)}14%,88%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.beam{position:absolute;left:10%;width:80%;bottom:20%;height:900px;pointer-events:none;z-index:4;background:linear-gradient(transparent,var(--c) 70%,#fff);opacity:0;mix-blend-mode:screen;animation:beam 1.1s ease-out both}
@keyframes beam{0%{opacity:0;transform:scaleX(.1)}20%{opacity:.9;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.05)}}

/* ===== 1. POP ART ===== */
.t-pop #bg{background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.18) 0 2px,transparent 2.5px) 0 0/14px 14px,repeating-conic-gradient(from 0deg at 50% 18%,#1d4fb8 0 7.5deg,#2a67d6 7.5deg 15deg)}
.t-pop #title{font:118px/1 Bangers,Impact,sans-serif;letter-spacing:2px;color:#ffc21a;-webkit-text-stroke:5px #0b0b12;paint-order:stroke fill;text-shadow:8px 8px 0 #0b0b12;transform:rotate(-2deg)}
.t-pop #count{padding:6px 26px 4px;font:44px Bangers,sans-serif;background:#f4f6f9;border:5px solid #0b0b12;border-radius:14px;box-shadow:7px 7px 0 #0b0b12;transform:rotate(1.5deg)}
.t-pop #count b{color:#e8333a;font-weight:400}.t-pop #count i{display:none}
.t-pop .step{background:radial-gradient(circle,rgba(0,0,0,.16) 1.4px,transparent 1.8px) 0 0/9px 9px,linear-gradient(#d9dee6,#aeb7c4);border-top:4px solid #0b0b12}
.t-pop .fan.in{animation:drop .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{0%{transform:translateY(-520px) scale(.7,1.2);opacity:0}55%{transform:translateY(0) scale(1.15,.82);opacity:1}75%{transform:translateY(-8%) scale(.95,1.06)}100%{transform:none}}
.t-pop .tag{font-family:Bangers,sans-serif;letter-spacing:.5px;padding:.12em .4em 0;background:#f4f6f9;color:#0b0b12;border:.14em solid #0b0b12;border-radius:.35em;box-shadow:.12em .12em 0 #0b0b12}
.t-pop .burst{font-family:Bangers,sans-serif;padding:.3em .7em .15em;background:#fff;color:#0b0b12;border:.13em solid #0b0b12;border-radius:1em;box-shadow:.15em .15em 0 #0b0b12}
.t-pop .burst.hi{background:#ffc21a}

/* ===== 2. NÉON (cyberpunk) ===== */
.t-neon #bg{background:radial-gradient(ellipse 70% 50% at 50% 0%,#3a0f6e 0%,#170833 45%,#07030f 100%)}
.t-neon #fx{opacity:.5;background:repeating-linear-gradient(103deg,transparent 0 22px,rgba(170,210,255,.07) 22px 23px,transparent 23px 61px);background-size:200px 200px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-40px 200px}}
.t-neon #title{font:900 104px/1 Orbitron,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#fff;text-shadow:-4px 0 #ff2bd6,4px 0 #00f0ff,0 0 28px rgba(255,43,214,.8),0 0 60px rgba(0,240,255,.5);animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,92%,100%{transform:none;clip-path:none}93%{transform:translate(6px,-2px) skewX(-8deg);clip-path:inset(10% 0 45% 0)}95%{transform:translate(-8px,2px);clip-path:inset(55% 0 5% 0)}}
.t-neon #count{padding:10px 28px;font:700 38px/1 "Chakra Petch",sans-serif;text-transform:uppercase;letter-spacing:3px;color:#f3ecff;background:rgba(5,3,10,.82);border:2px solid #00f0ff;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);box-shadow:inset 0 0 24px rgba(0,240,255,.35)}
.t-neon #count b{color:#e8ff3a;text-shadow:0 0 14px #e8ff3a;font-family:Orbitron}
.t-neon #count i{width:14px;height:14px;border-radius:50%;background:#ff2bd6;box-shadow:0 0 12px #ff2bd6;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.t-neon .step{background:linear-gradient(#141026,#07050f 70%);border-top:3px solid var(--c);box-shadow:0 -2px 18px var(--c)}
.t-neon .fan.in{animation:warp 1s steps(12) both}
@keyframes warp{0%{clip-path:inset(0 0 100% 0);opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1.2)}50%{transform:translateX(4%) skewX(-10deg)}60%{transform:none}100%{clip-path:inset(-60% -40% -10% -40%);transform:none}}
.t-neon .fan.lurk svg{filter:grayscale(1) sepia(1) hue-rotate(140deg) saturate(5)}
.t-neon .tag{font:700 1em "Chakra Petch",sans-serif;padding:.18em .5em .1em;background:rgba(5,3,10,.88);border:.1em solid var(--c);color:#fff;text-shadow:0 0 .4em var(--c);clip-path:polygon(.35em 0,100% 0,100% calc(100% - .35em),calc(100% - .35em) 100%,0 100%,0 .35em)}
.t-neon .burst{font-family:"Chakra Petch",sans-serif;font-weight:700;padding:.35em .75em .25em;background:rgba(8,4,20,.92);border:.08em solid #ff2bd6;color:#fff;box-shadow:0 0 .6em rgba(255,43,214,.7)}
.t-neon .burst.hi{border-color:#00f0ff;color:#00f0ff}

/* ===== 3. ARCADE 8-BIT ===== */
.t-arcade #bg{background:#0b0b2a}
.t-arcade #fx{background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.28) 3px 4px);box-shadow:inset 0 0 220px rgba(0,0,0,.75)}
.t-arcade #title{font:64px/1.2 "Press Start 2P",monospace;color:#ffcd3a;text-shadow:6px 6px 0 #e83b3b,12px 12px 0 #0b0b2a;text-transform:uppercase}
.t-arcade #count{margin-top:28px;padding:14px 22px;font:26px/1 "Press Start 2P",monospace;color:#fff;background:#0b0b2a;border:6px solid #fff;box-shadow:0 0 0 6px #0b0b2a,0 0 0 12px #41a6f6;text-transform:uppercase}
.t-arcade #count b{color:#ffcd3a;font-weight:400}.t-arcade #count i{width:18px;height:18px;background:#e83b3b;animation:blink 1s steps(1) infinite}
.t-arcade .step{background:repeating-linear-gradient(90deg,#3c3c5c 0 24px,#33334f 24px 48px);border-top:6px solid #8b8bb0}
.t-arcade .fan.in{animation:pix .6s steps(5) both}
@keyframes pix{0%{transform:translateY(-200%);opacity:0}40%{opacity:1}100%{transform:none}}
.t-arcade .fan.lurk{animation:blink 2s steps(1) infinite}
.t-arcade .tag{font:.5em/1.4 "Press Start 2P",monospace;padding:.35em .45em .2em;background:#0b0b2a;color:#fff;border:.25em solid var(--c)}
.t-arcade .burst{font-family:"Press Start 2P",monospace;font-size:calc(var(--fs) * .6);line-height:1.5;padding:.6em .8em .4em;background:#fff;color:#0b0b2a;border:.3em solid #0b0b2a;box-shadow:0 0 0 .3em #fff}
.t-arcade .burst.hi{background:#ffcd3a}

/* ===== 4. BROADCAST (plateau TV / esport) ===== */
.t-tv #bg{background:linear-gradient(115deg,transparent 0 55%,rgba(255,255,255,.05) 55% 62%,transparent 62%),radial-gradient(ellipse at 50% -20%,#2d4f9e,#0a1430 60%,#060b1c)}
.t-tv #title{font:italic 800 112px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#fff;letter-spacing:1px;padding:4px 40px 0 34px;border-left:16px solid #d7263d;background:linear-gradient(90deg,rgba(6,11,28,.85),rgba(6,11,28,0))}
.t-tv #count{font:800 36px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#14224a;background:#fff;padding:0 22px 0 0;gap:18px;letter-spacing:1px}
.t-tv #count b{background:#d7263d;color:#fff;padding:10px 20px;font-weight:800}.t-tv #count i{display:none}
.t-tv .step{background:linear-gradient(#26314b,#121a2e);border-top:2px solid rgba(255,255,255,.25)}
.t-tv .fan.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{0%{transform:translateY(40%);opacity:0}100%{transform:none;opacity:1}}
.t-tv .fan.lurk svg{opacity:.4}
.t-tv .tag{font:600 1.05em "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:.15em .55em .1em .45em;background:#14224a;color:#fff;border-left:.3em solid var(--c)}
.t-tv .burst{font:600 var(--fs) "Barlow Condensed",sans-serif;padding:.3em .8em;background:#fff;color:#14224a;border-left:.3em solid #d7263d}
.t-tv .burst.hi{background:#d7263d;color:#fff;border-left-color:#fff}

/* ===== 5. ARÈNE FUTURISTE ===== */
.t-arena #bg{background:radial-gradient(ellipse 60% 40% at 50% 12%,rgba(255,122,26,.25),transparent 70%),#0b0f14}
.t-arena #title{font:800 112px/1 "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:6px;color:#ff7a1a;text-shadow:0 0 30px rgba(255,122,26,.5);padding:0 40px;border-left:6px solid #19e3c4;border-right:6px solid #19e3c4}
.t-arena #count{font:600 36px/1 "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:4px;color:#e8edf2;padding:10px 26px;background:rgba(11,15,20,.85);border-top:3px solid #ff7a1a;border-bottom:3px solid #ff7a1a}
.t-arena #count b{color:#19e3c4;font-weight:800}.t-arena #count i{width:12px;height:28px;background:#ff7a1a;animation:blink .9s infinite}
.t-arena .step{background:linear-gradient(#1a2129,#0b0f14 80%);border-top:6px solid transparent;border-image:repeating-linear-gradient(45deg,#ff7a1a 0 14px,#0b0f14 14px 28px) 6}
.t-arena .fan.in{animation:scan .8s ease-out both}
@keyframes scan{0%{clip-path:inset(50% 0 50% 0);opacity:0;transform:scale(1.1)}50%{clip-path:inset(0 0 45% 0);opacity:1}100%{clip-path:inset(-60% -40% -10% -40%);transform:none}}
.t-arena .fan.lurk svg{filter:grayscale(1) sepia(1) hue-rotate(120deg) saturate(3)}
.t-arena .tag{font:600 1.05em "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;padding:.1em .5em 0;background:rgba(11,15,20,.92);color:#e8edf2;border:.08em solid var(--c);border-left-width:.3em}
.t-arena .burst{font:600 var(--fs) "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;padding:.3em .8em .2em;background:rgba(11,15,20,.95);color:#e8edf2;border:.08em solid #19e3c4;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.t-arena .burst.hi{color:#ff7a1a;border-color:#ff7a1a}

/* panneaux de test */
.panel{position:fixed;z-index:999;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 24px);padding:10px;background:#fff;color:#111;border:3px solid #111;border-radius:10px;box-shadow:4px 4px 0 #111;font:15px/1.3 system-ui,sans-serif}
#hud{left:12px;bottom:12px}#pick{right:12px;top:12px}
.panel button{min-height:40px;padding:0 14px;font:600 15px system-ui,sans-serif;background:#f1f1f1;color:#111;border:2px solid #111;border-radius:8px;cursor:pointer}
.panel button[aria-pressed=true]{background:#111;color:#fff}
.panel button:focus-visible{outline:3px solid #2e7cf6;outline-offset:2px}
#pick strong{padding:0 4px}
body.nohud .panel{display:none}
#warn{position:absolute;right:16px;bottom:12px;z-index:300;padding:6px 12px;font:700 20px system-ui,sans-serif;background:#2a0010;border:2px solid #ff3355;color:#ff9aaa;display:none}
.fan.tagc .tag{border-color:var(--c)}
@media (max-width:700px){.panel{font-size:13px}.panel button{min-height:36px;padding:0 9px;font-size:13px}#pick{left:12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#000"/></pattern></defs></svg>
<div id="stage">
 <div id="bg"></div>
 <div id="head"><div id="title">Le match va commencer</div><br><div id="count"><i></i><span><b>0</b> <span id="cl">supporter en tribune</span></span></div></div>
 <div id="rows"></div>
 <div id="fx"></div>
 <div id="warn"></div>
</div>
<div class="panel" id="pick" role="group" aria-label="Direction artistique"><strong>Style</strong></div>
<div class="panel" id="hud">
 <button id="b1">+1 supporter</button>
 <button id="b10">+10</button>
 <button id="bl">+5 silencieux</button>
 <button id="bm">Faire parler</button>
 <button id="bd">Démo auto : ON</button>
 <button id="bx">Vider</button>
 <span id="st" style="padding:0 6px">Mode démo</span>
</div>
<script>
{
const P=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,''));
if(P.get('bg')==='0')document.body.classList.add('clear');
const channel=(P.get('channel')||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
const token=(P.get('token')||'').replace(/[^a-z0-9]/gi,'');
const CLIENT_ID=(P.get('client_id')||'').replace(/[^a-z0-9]/gi,'');
const demo=P.has('demo')?P.get('demo')!=='0':!channel;
const showMsg=P.get('messages')!=='0';
const ignore=new Set((P.get('ignore')||'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,soundalerts,sery_bot,commanderroot').toLowerCase().split(','));
if(channel)ignore.add(channel);
if(P.get('hud')==='0'||(channel&&!P.has('hud')))document.body.classList.add('nohud');
if(P.has('title')){const t=P.get('title');if(t==='0')document.body.classList.add('notitle');else document.getElementById('title').textContent=t}
const stage=document.getElementById('stage');
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`};
addEventListener('resize',fit);fit();
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=seed=>()=>{seed=Math.imul(seed^seed>>>15,seed|1);seed^=seed+Math.imul(seed^seed>>>7,seed|61);return((seed^seed>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Look d'un supporter : des index neutres, chaque style les dessine à sa façon.
   Le futur site de personnalisation enregistrera ces mêmes index (coiffure, yeux, bouche, accessoire, couleur). ---------- */
const SKIN=['#ffd9b8','#f1bd8e','#d99a6c','#b07650','#82502f','#5a3620'];
const customLooks={};
function getLook(login){const R=rng(hash(login)),i=n=>Math.floor(R()*n);
 return Object.assign({skin:i(6),color:i(6),hairColor:i(7),hair:i(6),eyes:i(3),mouth:i(4),extra:i(4),num:1+i(98)},customLooks[login]||{})}

/* ---------- les 5 styles ---------- */
const T={};
/* 1. POP ART */
{const J=[['#1a56c8','#fff'],['#2ea3e8','#fff'],['#f4f6f9','#1a56c8'],['#ffc21a','#1a56c8'],['#e8333a','#fff'],['#1a56c8','#ffc21a']];
 const HC=['#1b1b1b','#5a3418','#a0522d','#f2c230','#e8333a','#f08ab0','#2ea3e8'];
 T.pop={name:'Pop art BD',seats:['#1a56c8','#1a56c8','#1a56c8','#2ea3e8','#2ea3e8','#2ea3e8','#f4f6f9','#f4f6f9','#ffc21a','#b9c1cc'],steps:['#000'],tag:L=>J[L.color][0]==='#f4f6f9'?'#1a56c8':J[L.color][0],
 bg:()=>'',
 chair:(c,n)=>`<svg class="chair" viewBox="0 0 100 80" preserveAspectRatio="none"><path d="M9 8Q50-3 91 8L86 70Q50 79 14 70Z" fill="${c}" stroke="#0b0b12" stroke-width="5" stroke-linejoin="round"/><path d="M9 8Q50-3 91 8L86 70Q50 79 14 70Z" fill="url(#dots)" opacity=".22"/><path d="M20 14Q36 9 48 10L44 30Q30 30 22 34Z" fill="#fff" opacity=".45"/><rect x="41" y="18" width="18" height="9" rx="2" fill="#dfe4ea" stroke="#0b0b12" stroke-width="2"/><text x="50" y="25.5" font-size="7" text-anchor="middle" font-family="Arial" font-weight="700">${n}</text></svg>`,
 fan:L=>{const sk=SKIN[L.skin],hc=HC[L.hairColor],[jc,jt]=J[L.color],O='stroke="#0b0b12" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
  const hair=[`<path d="M24 46Q20 14 50 13Q80 14 76 46Q70 28 50 27Q32 28 24 46Z" fill="${hc}" ${O}/>`,
   `<path d="M22 50Q14 10 50 10Q86 10 78 50Q74 60 70 48Q66 26 50 26Q34 26 30 48Q26 60 22 50Z" fill="${hc}" ${O}/>`,
   `<path d="M26 40L30 18L38 30L44 12L52 28L60 12L64 30L72 18L74 40Q62 28 50 29Q38 28 26 40Z" fill="${hc}" ${O}/>`,
   `<circle cx="50" cy="22" r="17" fill="${hc}" ${O}/><circle cx="30" cy="32" r="11" fill="${hc}" ${O}/><circle cx="70" cy="32" r="11" fill="${hc}" ${O}/>`,
   `<path d="M24 42Q24 14 50 14Q76 14 76 42L84 44Q84 50 76 48Z" fill="${jc}" ${O}/><path d="M38 20Q50 16 62 20" fill="none" stroke="${jt}" stroke-width="4"/>`,
   `<path d="M24 44Q22 16 50 15Q76 16 76 44Q60 30 40 34Q30 36 24 44Z" fill="${hc}" ${O}/><path d="M70 22Q88 34 80 66Q74 52 74 40Z" fill="${hc}" ${O}/>`][L.hair];
  const eyes=L.eyes===1?`<rect x="28" y="38" width="20" height="13" rx="5" fill="#0b0b12"/><rect x="52" y="38" width="20" height="13" rx="5" fill="#0b0b12"/><path d="M46 42H54" ${O}/><path d="M31 41l5 0" stroke="#fff" stroke-width="2.5"/>`

const rowsEl=document.getElementById('rows'),bgEl=document.getElementById('bg');
function render(key){
 th=T[key];document.body.className=document.body.className.replace(/\bt-\w+/g,'').trim()+' t-'+key;
 bgEl.innerHTML=th.bg();
 const R=rng(99);rowsEl.innerHTML='';
 geo.forEach((g,r)=>{const row=document.createElement('div');row.className='row';row.style.zIndex=10+r;row.style.top=(g.b-g.h)+'px';row.style.height=(g.h*2)+'px';
  row.innerHTML=`<div class="step" style="top:${g.h*.86}px;height:${g.h*1.2}px;--c:${th.steps[r%th.steps.length]}"></div>`+
   seats.map((s,i)=>s.row!==r?'':`<div class="seat" data-i="${i}" style="left:${s.x}px;top:0;width:${g.w}px;height:${g.h}px">${th.chair(th.seats[Math.floor(R()*th.seats.length)],s.num)}</div>`).join('');
  rowsEl.appendChild(row)});
 rowsEl.querySelectorAll('.seat').forEach(el=>seats[+el.dataset.i].el=el);
 for(const [login,f] of crowd)place(login,f,true);
 document.querySelectorAll('#pick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===key));
}
function place(login,f,quiet){const seat=f.seat,fan=document.createElement('div');
 fan.className='fan'+(quiet?'':' in')+(f.lurk?' lurk':'');fan.innerHTML=th.fan(f.look);
 const tag=document.createElement('div');tag.className='tag';tag.textContent=f.name;tag.style.fontSize=Math.max(12,seat.g.w*.17)+'px';tag.style.setProperty('--c',th.tag(f.look));
 fan.appendChild(tag);seat.el.appendChild(fan);seat.el.style.zIndex=2;
 if(!quiet)setTimeout(()=>fan.classList.remove('in'),1100)}

/* ---------- arrivée / départ ---------- */
const countB=document.querySelector('#count b'),countL=document.getElementById('cl');
const updateCount=()=>{countB.textContent=crowd.size;countL.textContent=crowd.size>1?'supporters en tribune':'supporter en tribune'};
function bubble(seat,text,hi){seat.el.querySelector('.burst')?.remove();const b=document.createElement('div');b.className='burst'+(hi?' hi':'');b.textContent=text;b.style.setProperty('--fs',Math.max(17,seat.g.w*.2)+'px');seat.el.appendChild(b);setTimeout(()=>b.remove(),4300)}
function beam(seat,c){if(!th.beam)return;const b=document.createElement('div');b.className='beam';b.style.setProperty('--c',c);seat.el.appendChild(b);setTimeout(()=>b.remove(),1200)}
function freeSeat(lurk){const empty=seats.filter(s=>!s.user);
 if(empty.length){const score=s=>s.row*2.2-Math.abs(s.x+s.g.w/2-960)/260+Math.random()*3+(lurk?-s.row*3:0);return empty.sort((a,b)=>score(b)-score(a))[0]}
 let old=null;for(const [k,v] of crowd)if(!old||(v.lurk&&!old[1].lurk)||(v.lurk===old[1].lurk&&v.last<old[1].last))old=[k,v];
 if(lurk&&!old[1].lurk)return null;leave(old[0]);return old[1].seat}
function leave(login){const f=crowd.get(login);if(!f)return;crowd.delete(login);const el=f.seat.el.querySelector('.fan');f.seat.user=null;f.seat.el.style.zIndex='';if(el){el.className='fan out';setTimeout(()=>el.remove(),500)}updateCount();save()}
const cut=m=>m.length>48?m.slice(0,46)+'…':m;
function arrive(login,display,o={}){login=login.toLowerCase();if(!login||ignore.has(login))return;const f=crowd.get(login),lurk=!!o.lurk;
 if(f){f.seen=Date.now();if(lurk)return;f.last=Date.now();const el=f.seat.el.querySelector('.fan');
  if(f.lurk){f.lurk=false;el.classList.remove('lurk');beam(f.seat,th.tag(f.look));bubble(f.seat,f.name,true)}
  el.classList.remove('in','hop');void el.offsetWidth;el.classList.add('hop');if(showMsg&&o.msg)bubble(f.seat,cut(o.msg));save();return}
 const seat=freeSeat(lurk);if(!seat)return;seat.user=login;
 const nf={seat,last:lurk?0:Date.now(),seen:Date.now(),lurk,name:display||login,look:getLook(login)};crowd.set(login,nf);place(login,nf,!!o.quiet);
 if(!o.quiet)beam(seat,th.tag(nf.look));updateCount();
 if(!lurk&&!o.quiet)setTimeout(()=>bubble(seat,nf.name,true),500);
 if(!lurk&&showMsg&&o.msg)setTimeout(()=>bubble(seat,cut(o.msg)),2600);save()}

/* ---------- mémoire entre Starting et Ending (6 h) ---------- */
const KEY='tribune3:'+(channel||'demo');let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),u:[...crowd].map(([k,v])=>[k,v.name,v.lurk])}))}catch(e){}},500)}

/* ---------- chat Twitch anonyme (IRC WebSocket, sans compte) ---------- */
const st=document.getElementById('st'),warn=document.getElementById('warn');
function connect(delay=1000){let ws;try{ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443')}catch(e){st.textContent='Connexion impossible ici';return}
 ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'+(P.get('lurkers')==='irc'?' twitch.tv/membership':''));
  ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(1e4+Math.random()*8e4));ws.send('JOIN #'+channel);st.textContent='Connecté à #'+channel;delay=1000};
 ws.onmessage=e=>e.data.split('\r\n').forEach(line=>{if(!line)return;if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return}
  let tags={},rest=line;if(rest[0]==='@'){const sp=rest.indexOf(' ');rest.slice(1,sp).split(';').forEach(kv=>{const i=kv.indexOf('=');tags[kv.slice(0,i)]=kv.slice(i+1)});rest=rest.slice(sp+1)}
  const m=rest.match(/^:([^!]+)!\S+ (PRIVMSG|JOIN|PART) #\S+(?: :(.*))?$/);if(!m)return;
  if(m[2]==='PRIVMSG')arrive(m[1],tags['display-name']||m[1],{msg:m[3]});
  else if(m[2]==='JOIN')arrive(m[1],m[1],{lurk:true});
  else{const f=crowd.get(m[1]);if(f&&f.lurk)leave(m[1])}});
 ws.onclose=()=>{st.textContent='Reconnexion…';setTimeout(()=>connect(Math.min(delay*2,30000)),delay)}}

/* ---------- viewers silencieux : API Twitch « Get Chatters » (jeton du streamer) ---------- */
async function helix(path){const r=await fetch('https://api.twitch.tv/helix/'+path,{headers:{Authorization:'Bearer '+token,'Client-Id':CLIENT_ID}});
 if(r.status===401)throw new Error('expired');if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function pollChatters(){
 try{const me=(await helix('users')).data[0];let all=[],cursor='';
  do{const j=await helix(`chat/chatters?broadcaster_id=${me.id}&moderator_id=${me.id}&first=1000${cursor?'&after='+cursor:''}`);
   all=all.concat(j.data);cursor=j.pagination&&j.pagination.cursor||''}while(cursor&&all.length<3000);
  const now=Date.now(),here=new Set(all.map(c=>c.user_login));
  all.forEach((c,i)=>setTimeout(()=>arrive(c.user_login,c.user_name,{lurk:true}),Math.min(i*120,20000)));
  for(const [k,v] of crowd)if(v.lurk&&!here.has(k)&&now-v.seen>150e3)leave(k);
  warn.style.display='none';setTimeout(pollChatters,60e3)}
 catch(e){warn.style.display='block';warn.textContent=e.message==='expired'?'Jeton Twitch expiré : reconnecte-toi sur la page connect':'API Twitch indisponible, nouvel essai dans 2 min';
  if(e.message!=='expired')setTimeout(pollChatters,120e3)}}

/* ---------- démo ---------- */
const A=['Kylo','Mimi','Zizou','Nala','Tchoupi','Neo','Loulou','Kenji','Sasha','Pixel','Gaby','Yasmine','Ronan','Lola','Max','Nina','Tito','Ines','Jojo','Malik','Rosa','Hugo','Lina','Sam','Volt','Byte'];
const B=['_TV','92','_FC','Gaming','_off','2077','_le_vrai','Ultra','13','_bzh','Live','_exe','','','',''];
let n=0;const fake=()=>{n++;return A[Math.floor(Math.random()*A.length)]+B[Math.floor(Math.random()*B.length)]+(n>40?n:'')};
const TALK=['GOOOAL','allez !!','on est chauds','qui a ramené les chips ?','ça commence quand ?','ALLEZZZ','première fois ici','gg','le son est nickel','je sortais du lurk'];
const talk=()=>{const k=[...crowd.keys()];if(k.length)arrive(k[Math.floor(Math.random()*k.length)],'',{msg:TALK[Math.floor(Math.random()*TALK.length)]})};
const add=lurk=>{const f=fake();arrive(f,f,{lurk})};
let auto=null;const bd=document.getElementById('bd');
const setAuto=on=>{clearInterval(auto);auto=on?setInterval(()=>{const r=Math.random();crowd.size<8||r<.45?add(false):r<.7?add(true):talk()},1000):null;bd.textContent='Démo auto : '+(on?'ON':'OFF')};
document.getElementById('b1').onclick=()=>add(false);
document.getElementById('b10').onclick=()=>{for(let i=0;i<10;i++)setTimeout(()=>add(false),i*120)};
document.getElementById('bl').onclick=()=>{for(let i=0;i<5;i++)setTimeout(()=>add(true),i*150)};
document.getElementById('bm').onclick=talk;bd.onclick=()=>setAuto(!auto);
document.getElementById('bx').onclick=()=>{[...crowd.keys()].forEach(leave);try{localStorage.removeItem(KEY)}catch(e){}};

/* ---------- sélecteur de style ---------- */
const pick=document.getElementById('pick'),keys=Object.keys(T);
keys.forEach((k,i)=>{const b=document.createElement('button');b.dataset.k=k;b.textContent=(i+1)+'. '+T[k].name;b.onclick=()=>{render(k);try{history.replaceState(null,'','#'+k)}catch(e){}};pick.appendChild(b)});
addEventListener('keydown',e=>{const i=+e.key-1;if(keys[i])render(keys[i])});
const start=P.get('theme')||location.hash.replace(/^#/,'');
render(T[start]?start:'tv');
try{if(P.get('reset')==='1')localStorage.removeItem(KEY);const d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d&&Date.now()-d.t<6*3600e3&&!demo)d.u.forEach(([l,nm,lk],i)=>setTimeout(()=>arrive(l,nm,{lurk:lk,quiet:true}),i*40))}catch(e){}
if(channel)connect();
if(channel&&token&&CLIENT_ID)pollChatters();
if(demo){for(let i=0;i<22;i++)add(i%4===3);setAuto(true);st.textContent=channel?'Démo + #'+channel:'Mode démo'}else setAuto(false);
}
