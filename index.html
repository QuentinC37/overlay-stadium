<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>/* sur l'adresse Cloudflare, l'accueil sans paramètre mène au vestiaire des viewers ; OBS garde ?channel=… */
if(/\.workers\.dev$/.test(location.hostname)&&!location.search&&!location.hash)location.replace('/perso')</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribune des supporters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;900&family=Chakra+Petch:wght@500;700&family=Press+Start+2P&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: cinq maquettes d'overlay à comparer en un clic, chacune avec son propre caractère.
IDEA: une même tribune, cinq « habillages » : la scène est identique, seul le style change.
PICTURE: la tribune qui se remplit, plein écran, avec un sélecteur de style en haut à droite.
COLOUR and TYPE: chaque style a sa palette et sa police (Bangers, Orbitron, Press Start 2P, Barlow Condensed, Saira Condensed).
LAYOUT: scène fixe 1920x1080 mise à l'échelle ; titre et compteur en haut, tribune sur les trois quarts du bas.
*/
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body.clear{background:transparent}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;inset:-400px 0 0 0}
#bg svg.layer{position:absolute;left:0;top:0;width:100%;height:100%}
#world{position:absolute;left:0;top:0;width:2304px;height:1296px;transform-origin:0 0;transition:transform 2.8s cubic-bezier(.5,0,.2,1);--inv:1}
#view{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#sfx{position:absolute;inset:0;z-index:190;pointer-events:none;overflow:hidden}
#hrow{display:inline-flex;gap:18px;align-items:flex-start;margin-top:20px;text-align:left}#hrow #count{margin-top:0;flex:none}
/* fil de chat (remplace les grosses bulles) */
#feed{display:none;width:var(--fw,1000px);height:146px;flex-direction:column;justify-content:flex-end;gap:7px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
body.feed #feed{display:flex}.scene-end #head #feed{display:none}
#feed .line{display:flex;align-items:flex-start;flex:none;font:600 30px/1.12 "Barlow Condensed",sans-serif;animation:lineIn .35s cubic-bezier(.2,.8,.2,1) both;transition:opacity 1s}
#feed .line b{flex:none;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#000;color:#fff;padding:6px 12px 4px;border-left:7px solid var(--c,#f26b1d)}
#feed .line span{background:#fff;color:#000;padding:6px 14px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#feed .line img{height:1.15em;vertical-align:-.22em;margin:0 .06em}
#feed .line.join span{background:#f26b1d;color:#fff;text-transform:uppercase;font-weight:800;letter-spacing:.5px}
#feed .line.ola b{background:#ffc21a;color:#000;border-left-color:#000}
#feed .line.host b{background:#fff;color:#000;border-left-color:#000}.t-frag #feed .line.host b{background:var(--acc);color:#000;border-left-color:var(--acc)}
#feed .line.hint span{background:rgba(0,0,0,.6);color:#fff;font-style:italic}
#feed .line.old{opacity:.55}
@keyframes lineIn{from{opacity:0;transform:translateY(26px)}}
/* petite bulle vide au-dessus de celui qui parle */
.ping{position:absolute;left:56%;bottom:86%;width:var(--pw);z-index:6;pointer-events:none;transform-origin:10% 100%;animation:pingIn .4s cubic-bezier(.2,1.6,.4,1) both}
.ping svg{display:block;width:100%;fill:#fff;stroke:#f26b1d;stroke-width:3.5;stroke-linejoin:round;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.ping.bye{animation:pingOut .3s ease-in forwards}
@keyframes pingIn{from{transform:scale(0)}}@keyframes pingOut{to{transform:scale(0);opacity:0}}
/* emplacement caméra (1/3 de l'écran) */
#camcol{display:none;position:absolute;top:0;width:640px;height:1080px;z-index:210;pointer-events:none;overflow:hidden}
body.cam #camcol{display:block}
#camframe{position:absolute;left:20px;right:20px;top:20px;aspect-ratio:16/9;outline:6px solid #f26b1d;box-shadow:0 0 0 2000px rgba(6,6,8,.92)}
body.portrait #camframe{bottom:20px;aspect-ratio:auto}
#camframe i{position:absolute;left:-6px;top:-6px;font:italic 800 28px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;background:#f26b1d;color:#fff;padding:7px 14px 5px}
#camframe em{position:absolute;inset:0;display:none;place-items:center;font:italic 800 40px "Barlow Condensed",sans-serif;text-transform:uppercase;color:rgba(255,255,255,.35);border:3px dashed rgba(255,255,255,.25)}
body:not(.nohud) #camframe em{display:grid}
#camcol #feed{position:absolute;left:20px;right:20px;top:398px;bottom:20px;width:auto;height:auto;gap:10px}
#camcol #feed .line span{white-space:normal;overflow-wrap:anywhere}
body.clear #bg{display:none}
#fx{position:absolute;inset:0;z-index:150;pointer-events:none}
#head{position:absolute;left:0;right:0;top:40px;text-align:center;z-index:200;pointer-events:none}
#title{display:inline-block}
#count{display:inline-flex;gap:14px;align-items:center;margin-top:20px}
body.notitle #head{display:none}
.row{position:absolute;left:0;width:2304px}
.step{position:absolute;left:0;right:0}
.seat{position:absolute}
.seat>svg.chair{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
.fan{position:absolute;left:2.5%;width:95%;bottom:8%;transform-origin:50% 100%}
.fan svg{display:block;width:100%;height:auto;overflow:visible}
.fan.lurk svg{opacity:.5;filter:grayscale(1)}
.fan.hop{animation:hop .5s ease-out}
.fan.out{animation:fade .5s ease-in both}
@keyframes hop{40%{transform:translateY(-20%)}70%{transform:scaleY(.93)}}
@keyframes fade{to{opacity:0;transform:translateY(-30%) scale(.6)}}
.tag{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);max-width:124%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.burst{position:absolute;left:50%;bottom:108%;transform:translateX(-50%);z-index:5;pointer-events:none;white-space:nowrap;max-width:380px;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs);animation:pop 4.2s ease both}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.3)}8%{opacity:1;transform:translateX(-50%) scale(1.1)}14%,88%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.beam{position:absolute;left:10%;width:80%;bottom:20%;height:900px;pointer-events:none;z-index:4;background:linear-gradient(transparent,var(--c) 70%,#fff);opacity:0;mix-blend-mode:screen;animation:beam 1.1s ease-out both}
@keyframes beam{0%{opacity:0;transform:scaleX(.1)}20%{opacity:.9;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.05)}}

.fan.walking svg{animation:bob .32s ease-in-out infinite alternate;transform-origin:50% 100%}
.fan.walking.fromR svg{--tilt:-4deg}.fan.walking.fromL svg{--tilt:4deg}
@keyframes bob{from{transform:translateY(0) rotate(calc(var(--tilt) * -1))}to{transform:translateY(-6%) rotate(var(--tilt))}}
/* ===== 1. POP ART ===== */
.t-pop #bg{background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.18) 0 2px,transparent 2.5px) 0 0/14px 14px,repeating-conic-gradient(from 0deg at 50% 18%,#1d4fb8 0 7.5deg,#2a67d6 7.5deg 15deg)}
.t-pop #title{font:118px/1 Bangers,Impact,sans-serif;letter-spacing:2px;color:#ffc21a;-webkit-text-stroke:5px #0b0b12;paint-order:stroke fill;text-shadow:8px 8px 0 #0b0b12;transform:rotate(-2deg)}
.t-pop #count{padding:6px 26px 4px;font:44px Bangers,sans-serif;background:#f4f6f9;border:5px solid #0b0b12;border-radius:14px;box-shadow:7px 7px 0 #0b0b12;transform:rotate(1.5deg)}
.t-pop #count b{color:#e8333a;font-weight:400}.t-pop #count i{display:none}
.t-pop .step{background:radial-gradient(circle,rgba(0,0,0,.16) 1.4px,transparent 1.8px) 0 0/9px 9px,linear-gradient(#d9dee6,#aeb7c4);border-top:4px solid #0b0b12}
.t-pop .fan.in{animation:drop .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{0%{transform:translateY(-520px) scale(.7,1.2);opacity:0}55%{transform:translateY(0) scale(1.15,.82);opacity:1}75%{transform:translateY(-8%) scale(.95,1.06)}100%{transform:none}}
.t-pop .tag{font-family:Bangers,sans-serif;letter-spacing:.5px;padding:.12em .4em 0;background:#f4f6f9;color:#0b0b12;border:.14em solid #0b0b12;border-radius:.35em;box-shadow:.12em .12em 0 #0b0b12}
.t-pop .burst{font-family:Bangers,sans-serif;padding:.3em .7em .15em;background:#fff;color:#0b0b12;border:.13em solid #0b0b12;border-radius:1em;box-shadow:.15em .15em 0 #0b0b12}
.t-pop .burst.hi{background:#ffc21a}

/* ===== 2. NÉON (cyberpunk) ===== */
.t-neon #bg{background:radial-gradient(ellipse 70% 50% at 50% 0%,#3a0f6e 0%,#170833 45%,#07030f 100%)}
.t-neon #fx{opacity:.5;background:repeating-linear-gradient(103deg,transparent 0 22px,rgba(170,210,255,.07) 22px 23px,transparent 23px 61px);background-size:200px 200px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-40px 200px}}
.t-neon #title{font:900 104px/1 Orbitron,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#fff;text-shadow:-4px 0 #ff2bd6,4px 0 #00f0ff,0 0 28px rgba(255,43,214,.8),0 0 60px rgba(0,240,255,.5);animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,92%,100%{transform:none;clip-path:none}93%{transform:translate(6px,-2px) skewX(-8deg);clip-path:inset(10% 0 45% 0)}95%{transform:translate(-8px,2px);clip-path:inset(55% 0 5% 0)}}
.t-neon #count{padding:10px 28px;font:700 38px/1 "Chakra Petch",sans-serif;text-transform:uppercase;letter-spacing:3px;color:#f3ecff;background:rgba(5,3,10,.82);border:2px solid #00f0ff;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);box-shadow:inset 0 0 24px rgba(0,240,255,.35)}
.t-neon #count b{color:#e8ff3a;text-shadow:0 0 14px #e8ff3a;font-family:Orbitron}
.t-neon #count i{width:14px;height:14px;border-radius:50%;background:#ff2bd6;box-shadow:0 0 12px #ff2bd6;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.t-neon .step{background:linear-gradient(#141026,#07050f 70%);border-top:3px solid var(--c);box-shadow:0 -2px 18px var(--c)}
.t-neon .fan.in{animation:warp 1s steps(12) both}
@keyframes warp{0%{clip-path:inset(0 0 100% 0);opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1.2)}50%{transform:translateX(4%) skewX(-10deg)}60%{transform:none}100%{clip-path:inset(-60% -40% -10% -40%);transform:none}}
.t-neon .fan.lurk svg{filter:grayscale(1) sepia(1) hue-rotate(140deg) saturate(5)}
.t-neon .tag{font:700 1em "Chakra Petch",sans-serif;padding:.18em .5em .1em;background:rgba(5,3,10,.88);border:.1em solid var(--c);color:#fff;text-shadow:0 0 .4em var(--c);clip-path:polygon(.35em 0,100% 0,100% calc(100% - .35em),calc(100% - .35em) 100%,0 100%,0 .35em)}
.t-neon .burst{font-family:"Chakra Petch",sans-serif;font-weight:700;padding:.35em .75em .25em;background:rgba(8,4,20,.92);border:.08em solid #ff2bd6;color:#fff;box-shadow:0 0 .6em rgba(255,43,214,.7)}
.t-neon .burst.hi{border-color:#00f0ff;color:#00f0ff}

/* ===== 3. ARCADE 8-BIT ===== */
.t-arcade #bg{background:#0b0b2a}
.t-arcade #fx{background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.28) 3px 4px);box-shadow:inset 0 0 220px rgba(0,0,0,.75)}
.t-arcade #title{font:64px/1.2 "Press Start 2P",monospace;color:#ffcd3a;text-shadow:6px 6px 0 #e83b3b,12px 12px 0 #0b0b2a;text-transform:uppercase}
.t-arcade #count{margin-top:28px;padding:14px 22px;font:26px/1 "Press Start 2P",monospace;color:#fff;background:#0b0b2a;border:6px solid #fff;box-shadow:0 0 0 6px #0b0b2a,0 0 0 12px #41a6f6;text-transform:uppercase}
.t-arcade #count b{color:#ffcd3a;font-weight:400}.t-arcade #count i{width:18px;height:18px;background:#e83b3b;animation:blink 1s steps(1) infinite}
.t-arcade .step{background:repeating-linear-gradient(90deg,#3c3c5c 0 24px,#33334f 24px 48px);border-top:6px solid #8b8bb0}
.t-arcade .fan.in{animation:pix .6s steps(5) both}
@keyframes pix{0%{transform:translateY(-200%);opacity:0}40%{opacity:1}100%{transform:none}}
.t-arcade .fan.lurk{animation:blink 2s steps(1) infinite}
.t-arcade .tag{font:.5em/1.4 "Press Start 2P",monospace;padding:.35em .45em .2em;background:#0b0b2a;color:#fff;border:.25em solid var(--c)}
.t-arcade .burst{font-family:"Press Start 2P",monospace;font-size:calc(var(--fs) * .6);line-height:1.5;padding:.6em .8em .4em;background:#fff;color:#0b0b2a;border:.3em solid #0b0b2a;box-shadow:0 0 0 .3em #fff}
.t-arcade .burst.hi{background:#ffcd3a}

/* ===== 4. BROADCAST (plateau TV / esport) ===== */
.t-tv #bg{background:linear-gradient(115deg,transparent 0 55%,rgba(255,255,255,.05) 55% 62%,transparent 62%),radial-gradient(ellipse at 50% -20%,#1e1e22,#0a0a0b 60%,#000)}
.t-tv #title{font:italic 800 112px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#fff;letter-spacing:1px;padding:4px 40px 0 34px;border-left:16px solid #f26b1d;background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,0))}
.t-tv #count{font:800 36px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#000;background:#fff;padding:0 22px 0 0;gap:18px;letter-spacing:1px}
.t-tv #count b{background:#f26b1d;color:#fff;padding:10px 20px;font-weight:800}.t-tv #count i{display:none}
.t-tv .step{background:linear-gradient(#1c1c1f,#080809);border-top:2px solid rgba(255,255,255,.25)}
.t-tv .fan.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{0%{transform:translateY(40%);opacity:0}100%{transform:none;opacity:1}}
.t-tv .fan.lurk svg{opacity:.4}
.t-tv .tag{font:600 1.05em "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:.15em .55em .1em .45em;background:#000;color:#fff;border-left:.3em solid var(--c)}
.t-tv .burst{font:600 var(--fs) "Barlow Condensed",sans-serif;padding:.3em .8em;background:#fff;color:#000;border-left:.3em solid #f26b1d}
.t-tv .burst.hi{background:#f26b1d;color:#fff;border-left-color:#fff}

.t-tv .sheen{position:absolute;inset:0 -40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 49%,rgba(242,107,29,.06) 52%,transparent 58%);animation:sheen 11s linear infinite}
@keyframes sheen{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
.t-tv .bk{transform-box:fill-box;transform-origin:center;animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--x),var(--y)) scale(1.15)}}
.t-tv .spot{position:absolute;top:-80px;width:520px;height:1200px;mix-blend-mode:screen;transform-origin:50% 0;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,255,255,.16),transparent 75%);animation:spot 9s ease-in-out infinite alternate}
.t-tv .spot.l{left:60px;--a:-28deg;--b:12deg}.t-tv .spot.r{right:60px;--a:28deg;--b:-12deg;background:linear-gradient(rgba(242,107,29,.2),transparent 75%);animation-delay:-4.5s}
@keyframes spot{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
.t-tv .tw{animation:tw 3s ease-in-out infinite alternate}@keyframes tw{to{opacity:.1}}
#space{position:absolute;inset:0;overflow:hidden}
.ship{position:absolute;left:0;animation:fly var(--t) linear forwards;will-change:transform}
@keyframes fly{from{transform:translate(var(--x0),0)}to{transform:translate(var(--x1),var(--dy))}}
.ship .in{position:relative;transform-origin:0 50%}
.ship svg{display:block}
.ship .fl{transform-box:fill-box;transform-origin:right center;animation:flame .12s steps(2) infinite}@keyframes flame{50%{transform:scaleX(.6)}}
.bolt{position:absolute;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 60%,#f26b1d);box-shadow:0 0 8px #f26b1d;animation:shoot .75s linear forwards}
.bolt.w{background:linear-gradient(90deg,transparent,#fff 60%,#9fe8ff);box-shadow:0 0 8px #9fe8ff}
@keyframes shoot{from{transform:translateX(0)}to{transform:translateX(1100px);opacity:.2}}
.lone{position:absolute;left:0;width:90px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,#f26b1d);box-shadow:0 0 8px #f26b1d;animation:lone var(--t) linear forwards}
@keyframes lone{from{transform:translate(var(--x0),0) rotate(var(--r))}to{transform:translate(var(--x1),var(--dy)) rotate(var(--r))}}
.boom{position:absolute;width:0;height:0}
.boom .fla{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#ffd08a 22%,#f26b1d 40%,rgba(242,107,29,0) 70%);animation:fla .9s ease-out forwards}
@keyframes fla{0%{transform:scale(.1);opacity:1}30%{transform:scale(1)}100%{transform:scale(1.3);opacity:0}}
.boom .ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:3px solid #fff;animation:ring .8s ease-out forwards}
@keyframes ring{from{transform:scale(.1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.boom .deb{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#ffb27a;animation:deb 1s ease-out forwards}
@keyframes deb{from{transform:rotate(var(--a)) translateX(0)}to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
.gren{position:absolute;width:10px;height:10px;border-radius:50%;background:#2a2a2e;border:2px solid #f26b1d;animation:gren .7s cubic-bezier(.3,0,.7,1) forwards}
@keyframes gren{from{transform:translate(var(--sx),var(--sy)) rotate(0)}to{transform:translate(0,0) rotate(540deg)}}
body.calm #space{display:none}
/* ===== 5. ARÈNE FUTURISTE ===== */
.t-arena #bg{background:radial-gradient(ellipse 60% 40% at 50% 12%,rgba(255,122,26,.25),transparent 70%),#0b0f14}
.t-arena #title{font:800 112px/1 "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:6px;color:#ff7a1a;text-shadow:0 0 30px rgba(255,122,26,.5);padding:0 40px;border-left:6px solid #19e3c4;border-right:6px solid #19e3c4}
.t-arena #count{font:600 36px/1 "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:4px;color:#e8edf2;padding:10px 26px;background:rgba(11,15,20,.85);border-top:3px solid #ff7a1a;border-bottom:3px solid #ff7a1a}
.t-arena #count b{color:#19e3c4;font-weight:800}.t-arena #count i{width:12px;height:28px;background:#ff7a1a;animation:blink .9s infinite}
.t-arena .step{background:linear-gradient(#1a2129,#0b0f14 80%);border-top:6px solid transparent;border-image:repeating-linear-gradient(45deg,#ff7a1a 0 14px,#0b0f14 14px 28px) 6}
.t-arena .fan.in{animation:scan .8s ease-out both}
@keyframes scan{0%{clip-path:inset(50% 0 50% 0);opacity:0;transform:scale(1.1)}50%{clip-path:inset(0 0 45% 0);opacity:1}100%{clip-path:inset(-60% -40% -10% -40%);transform:none}}
.t-arena .fan.lurk svg{filter:grayscale(1) sepia(1) hue-rotate(120deg) saturate(3)}
.t-arena .tag{font:600 1.05em "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;padding:.1em .5em 0;background:rgba(11,15,20,.92);color:#e8edf2;border:.08em solid var(--c);border-left-width:.3em}
.t-arena .burst{font:600 var(--fs) "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;padding:.3em .8em .2em;background:rgba(11,15,20,.95);color:#e8edf2;border:.08em solid #19e3c4;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.t-arena .burst.hi{color:#ff7a1a;border-color:#ff7a1a}

/* 6. FRAG CARDS */
body{--acc:#3dff8f;--accA:rgba(61,255,143,.18);--accR:61,255,143}
body.rgb{--acc:hsl(var(--hue) 92% 60%);--accA:hsla(var(--hue),92%,60%,.18)}
.seat.owned .chair .ln{stroke:var(--sc)!important}
.t-frag #bg{background:radial-gradient(ellipse 60% 55% at 18% 0%,rgba(61,255,143,.10),transparent 70%),linear-gradient(#0e0f13,#0a0b0d 60%,#060607)}
.t-frag .map{filter:blur(5px) brightness(.32) saturate(.5)}
.t-frag .fragtint{position:absolute;inset:0;background:linear-gradient(rgba(10,11,13,.55),rgba(10,11,13,.2) calc(var(--st,680px) - 120px),rgba(6,6,7,.9) calc(var(--st,680px) + 380px))}

 if(FEED){if(kind==='msg'){ping(f);if(NOCHAT&&!COLFEED)return}feedLine(f.name,toks,kind,f.color);return}
 const i=Q.findIndex(q=>q.f===f);if(i>=0)Q.splice(i,1);Q.push({f,kind,toks});pump()}

function show({f,kind,toks}){const fan=f.seat.el.querySelector('.fan:not(.leaving)');if(!fan)return;
 fan.querySelector('.chat')?.remove();active++;
 const c=document.createElement('div');c.className='chat '+kind;const inv=1/cam.S,fs=Math.max(20*inv,f.seat.g.w*.22);c.style.setProperty('--fs',fs+'px');

 // mesure la bulle complète, puis la cale pour qu'elle reste entièrement à l'écran
 const put=t=>{if(typeof t==='string')txt.append(t);else{const im=document.createElement('img');im.src=t.img;im.alt='';im.width=im.height=Math.round(fs*1.35);txt.append(im)}};
 toks.forEach(put);const w=Math.ceil(c.getBoundingClientRect().width/(c.getBoundingClientRect().width/c.offsetWidth||1))+4;c.style.width=w+'px';
 const base=f.seat.x+fan.offsetLeft,want=base+fan.offsetWidth/2-w/2,x=Math.min(Math.max(want,cam.x0+8*inv),cam.x0+cam.vw-8*inv-w);
 c.style.left=(x-base)+'px';c.style.transform='none';txt.textContent='';
 let i=0;const step=()=>{if(i>=toks.length||!c.isConnected)return;const t=toks[i++];
  put(t);
  setTimeout(step,typeof t==='string'?26:80)};step();
 const dur=Math.min(7500,2600+toks.length*55);let done=false;
 const end=()=>{if(done)return;done=true;active--;c.classList.add('bye');setTimeout(()=>{c.remove();if(!fan.querySelector('.chat'))fan.classList.remove('speaking')},350);pump()};
 setTimeout(end,dur);new MutationObserver((m,o)=>{if(!c.isConnected){o.disconnect();end()}}).observe(fan,{childList:true})}

/* ---------- 4. ola quand le chat répète la même chose ---------- */
const recent=[];let lastWave=0;const OLA=+(P.get('ola')||3);
const norm=m=>m.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1');
function hype(login,msg){const k=norm(msg);if(!k||k.length>20)return;const now=Date.now();recent.push({k,login,t:now});
 while(recent.length&&now-recent[0].t>20000)recent.shift();
 const who=new Set(recent.filter(r=>r.k===k).map(r=>r.login));if(who.size>=OLA&&now-lastWave>25000){lastWave=now;wave(msg.slice(0,24),who.size)}}
function wave(label,n){const tx=label?`« ${label} » ×${n}`:'La tribune se lève';if(FEED)feedLine('Ola !',Array.from(tx),'ola');else notify('Ola !',tx,'ola');
 for(const [,f] of crowd){const s=f.seat.el.querySelector('.fan:not(.leaving) svg');if(!s)continue;const d=Math.max(0,(f.seat.x-cam.x0)/cam.vw)*1500;

/* ---------- arrivée / départ ---------- */
function freeSeat(lurk,prefer){let empty=cam.vis.filter(s=>!s.user);
 if(!empty.length&&lvl<LEVELS.length-1){setLevel(lvl+1);empty=cam.vis.filter(s=>!s.user)}
 if(empty.length){ // place au hasard sur toute la tribune, en évitant si possible de coller un voisin (bulles lisibles)
  const crowdNear=s=>seats.filter(o=>o.user&&Math.abs(o.row-s.row)<=1&&Math.abs((o.x+o.g.w/2)-(s.x+s.g.w/2))<s.g.w*1.6).length;
  let best=null,bs=1e9;for(let i=0;i<5;i++){const c=empty[Math.floor(Math.random()*empty.length)],n=crowdNear(c);if(n<bs){bs=n;best=c}}return best}
 let old=null;for(const [k,v] of crowd)if(!v.medal&&(!old||(v.lurk&&!old[1].lurk)||(v.lurk===old[1].lurk&&v.last<old[1].last)))old=[k,v];
 if(!old||(lurk&&!old[1].lurk))return null;const s=old[1].seat;leave(old[0]);return s}
function leave(login){const f=crowd.get(login);if(!f)return;crowd.delete(login);Q.splice(0,Q.length,...Q.filter(q=>q.f!==f));
 const el=f.seat.el.querySelector('.fan:not(.leaving)');f.seat.user=null;f.seat.el.classList.remove('owned');
 if(el){if(WALK)walkOut(el,f.seat);else{el.className='fan out';setTimeout(()=>el.remove(),500)}}else f.seat.el.style.zIndex='';
 updateCount();crownCheck();save()}
function crownCheck(){let top=null;for(const [,f] of crowd)if((f.count||0)>=3&&(!top||f.count>top.count))top=f;
 for(const [,f] of crowd){const want=f===top;if(!!f.crown!==want){f.crown=want;deco(f)}}}
function parseBadges(s){const b={};(s||'').split(',').forEach(x=>{const k=x.split('/')[0];if(k==='subscriber'||k==='founder')b.sub=1;if(k==='moderator'||k==='broadcaster')b.mod=1;if(k==='vip')b.vip=1});return b}
function arrive(login,display,o={}){login=login.toLowerCase();if(!login||ignore.has(login)||/^justinfan\d+$/.test(login))return; // justinfanNNNN = lecteurs anonymes (dont l'overlay lui-même)
const f=crowd.get(login),lurk=!!o.lurk;
 if(f){f.seen=Date.now();if(lurk)return;f.last=Date.now();if(o.badges)f.badges=o.badges;if(o.color){f.color=o.color;f.seat.el.querySelector('.fan:not(.leaving) .tag')?.style.setProperty('--c',o.color)}
  const el=f.seat.el.querySelector('.fan:not(.leaving)');if(!el)return;
  if(f.lurk){f.lurk=false;el.classList.remove('lurk');beam(f.seat,th.tag(f.look));say(f,'join',Array.from('sort du lurk !'))}
  if(o.msg){f.count=(f.count||0)+1;el.classList.remove('in','hop');void el.offsetWidth;el.classList.add('hop');say(f,'msg',tokens(o.msg,o.emotes));crownCheck()}
  deco(f);save();return}
 const seat=freeSeat(lurk);if(!seat)return;seat.user=login;
 const nf={login,seat,last:lurk?0:Date.now(),seen:Date.now(),lurk,raid:!!o.raid,name:display||login,look:getLook(login),color:o.color||'',badges:o.badges||{},count:o.count||0};
 crowd.set(login,nf);const t=place(login,nf,!!o.quiet);if(!o.quiet)setTimeout(fillCheck,t);
 if(!o.quiet)beam(seat,th.tag(nf.look));updateCount();
 if(!lurk&&!o.quiet&&!o.raid)setTimeout(()=>say(nf,'join',Array.from('arrive en tribune')),t);
 if(o.msg){nf.count++;setTimeout(()=>say(nf,'msg',tokens(o.msg,o.emotes)),t+300);crownCheck()}save()}

 const order=[0,1,2,3,4].map(i=>frontRow[i]).filter(Boolean);

/* ---------- chat Twitch anonyme (IRC WebSocket, sans compte) ---------- */
const st=document.getElementById('st'),warn=document.getElementById('warn');
let chatWs=null,chatSeen=0;
// garde-fou : OBS peut garder une connexion morte sans jamais la fermer (veille, coupure réseau).
// Twitch envoie un PING toutes les ~5 min ; on en envoie un aussi, et sans aucune nouvelle depuis 6 min on reconnecte.
setInterval(()=>{if(!chatWs||chatWs.readyState!==1)return;if(Date.now()-chatSeen>6*60e3){chatWs.close();return}try{chatWs.send('PING :tribune')}catch(e){}},2*60e3);
function connect(delay=1000){let ws;try{ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443')}catch(e){st.textContent='Connexion impossible ici';return}
 chatWs=ws;chatSeen=Date.now();
 ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'+(P.get('lurkers')==='irc'?' twitch.tv/membership':''));
  ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(1e4+Math.random()*8e4));ws.send('JOIN #'+channel);st.textContent='Connexion à #'+channel+'…';delay=1000};
 ws.onmessage=e=>{chatSeen=Date.now();e.data.split('\r\n').forEach(line=>{if(!line)return;if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return}
  let tags={},rest=line;if(rest[0]==='@'){const sp=rest.indexOf(' ');rest.slice(1,sp).split(';').forEach(kv=>{const i=kv.indexOf('=');tags[kv.slice(0,i)]=kv.slice(i+1).replace(/\\s/g,' ')});rest=rest.slice(sp+1)}
  if(/^:tmi\.twitch\.tv ROOMSTATE #/.test(rest)){st.textContent='Connecté à #'+channel;return}
  if(/^:tmi\.twitch\.tv RECONNECT/.test(rest)){ws.close();return}
  const cl=rest.match(/^:tmi\.twitch\.tv CLEARCHAT #\S+ :(\S+)$/); // ban ou timeout : le viewer quitte la tribune
  if(cl){leave(cl[1].toLowerCase());return}
  const u=rest.match(/^:tmi\.twitch\.tv USERNOTICE #\S+(?: :(.*))?$/);
  if(u){const id=tags['msg-id'],login=tags.login||'',name=tags['display-name']||login;
   if(id==='sub'||id==='resub')onSub(login,name,+tags['msg-param-cumulative-months']||1);
   else if(id==='subgift')onSub((tags['msg-param-recipient-user-name']||'').toLowerCase(),tags['msg-param-recipient-display-name']||'',1,name);
   else if(id==='submysterygift')alertShip('Subs offerts',`${name} offre ${tags['msg-param-mass-gift-count']||''} subs`,'sub',standSmoke);
   else if(id==='raid')onRaid(login,tags['msg-param-displayName']||name,+tags['msg-param-viewerCount']||1);
   return}
  const m=rest.match(/^:([^!]+)!\S+ (PRIVMSG|JOIN|PART) #\S+(?: :(.*))?$/);if(!m)return;
  if(m[2]==='PRIVMSG'){let msg=m[3]||'';const act=msg.match(/^\u0001ACTION (.*)\u0001$/);if(act)msg=act[1];
   if(m[1]===channel){if(FEED&&(!NOCHAT||COLFEED))feedLine(tags['display-name']||m[1],tokens(msg,tags.emotes),'host')}else // le streamer : dans le fil, sans siège
   arrive(m[1],tags['display-name']||m[1],{msg,emotes:tags.emotes,color:tags.color,badges:parseBadges(tags.badges)});hype(m[1],msg);
   if(+tags.bits>0){const f=crowd.get(m[1]);if(f)setTimeout(()=>onBits(f,+tags.bits),300)}}
  else if(m[2]==='JOIN')arrive(m[1],m[1],{lurk:true});
  else{const f=crowd.get(m[1]);if(f&&f.lurk)leave(m[1])}})};
 ws.onclose=()=>{if(chatWs!==ws)return;chatWs=null;st.textContent='Reconnexion…';setTimeout(()=>connect(Math.min(delay*2,30000)),delay)}}

/* ---------- API Twitch (jeton du streamer) : viewers silencieux + follows ---------- */
async function helix(path,opt={}){const r=await fetch('https://api.twitch.tv/helix/'+path,Object.assign({headers:{Authorization:'Bearer '+token,'Client-Id':CLIENT_ID,'Content-Type':'application/json'}},opt));
 if(r.status===401)throw new Error('expired');if(!r.ok)throw new Error('http '+r.status);return r.status===204?{}:r.json()}
let meP=null;const me=()=>meP||(meP=helix('users').then(j=>j.data[0]));
async function pollChatters(){
 try{const u=await me();let all=[],cursor='';
  do{const j=await helix(`chat/chatters?broadcaster_id=${u.id}&moderator_id=${u.id}&first=1000${cursor?'&after='+cursor:''}`);
   all=all.concat(j.data);cursor=j.pagination&&j.pagination.cursor||''}while(cursor&&all.length<3000);
  const now=Date.now(),here=new Set(all.map(c=>c.user_login));
  all.forEach((c,i)=>setTimeout(()=>arrive(c.user_login,c.user_name,{lurk:true}),Math.min(i*120,20000)));
  for(const [k,v] of crowd)if(v.lurk&&!here.has(k)&&now-v.seen>150e3)leave(k);
  warn.style.display='none';setTimeout(pollChatters,60e3)}
 catch(e){warn.style.display='block';warn.textContent=e.message==='expired'?'Jeton Twitch expiré : reconnecte-toi sur la page connect':'API Twitch indisponible, nouvel essai dans 2 min';
  if(e.message!=='expired')setTimeout(pollChatters,120e3)}}
function followEvents(url='wss://eventsub.wss.twitch.tv/ws'){let ws;try{ws=new WebSocket(url)}catch(e){return}
 ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}const t=m.metadata&&m.metadata.message_type;
  if(t==='session_welcome'){try{const u=await me();await helix('eventsub/subscriptions',{method:'POST',body:JSON.stringify({type:'channel.follow',version:'2',condition:{broadcaster_user_id:u.id,moderator_user_id:u.id},transport:{method:'websocket',session_id:m.payload.session.id}})})}catch(x){console.warn('follow:',x.message)}}
  else if(t==='notification'&&m.payload.subscription.type==='channel.follow'){const ev=m.payload.event;onFollow(ev.user_login,ev.user_name)}
  else if(t==='session_reconnect'){ws.onclose=null;followEvents(m.payload.session.reconnect_url)}};
 ws.onclose=()=>setTimeout(()=>followEvents(),15000)}
