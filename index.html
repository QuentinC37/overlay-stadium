<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribune néon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: un match de nuit dans une mégapole cyberpunk, électrique mais lisible de loin dans OBS.
IDEA: le stade est un terminal : chaque supporter se « téléporte » dans son siège quand il se connecte au chat.
PICTURE: gradins sombres bordés de LED, skyline sous la pluie, supporters à visières, crêtes et implants néon.
COLOUR and TYPE: nuit violette, cyan et magenta en néon, jaune acide rare ; Orbitron pour le titre, Chakra Petch pour les pseudos.
LAYOUT: scène fixe 1920x1080 mise à l'échelle ; titre et compteur en haut, tribune sur les trois quarts du bas.
*/
:root{--ink:#05030a;--night:#0b0618;--cyan:#00f0ff;--pink:#ff2bd6;--violet:#8a5cff;--acid:#e8ff3a;--text:#f3ecff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body.clear{background:transparent}
body{font-family:"Chakra Petch",system-ui,sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,#3a0f6e 0%,#170833 45%,#07030f 100%)}
#bg svg{position:absolute;left:0;top:0;width:1920px;height:520px}
.beamL,.beamR{position:absolute;top:-120px;width:900px;height:900px;opacity:.22;mix-blend-mode:screen;animation:sway 9s ease-in-out infinite alternate}
.beamL{left:-260px;background:conic-gradient(from 120deg at 30% 10%,transparent 0 8deg,var(--cyan) 12deg,transparent 22deg)}
.beamR{right:-260px;background:conic-gradient(from 210deg at 70% 10%,transparent 0 8deg,var(--pink) 12deg,transparent 22deg);animation-delay:-4s}
@keyframes sway{to{transform:rotate(6deg)}}
#rain{position:absolute;inset:0;z-index:150;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(103deg,transparent 0 22px,rgba(170,210,255,.07) 22px 23px,transparent 23px 61px);
 background-size:200px 200px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-40px 200px}}
body.clear #bg,body.norain #rain{display:none}
#head{position:absolute;left:0;right:0;top:40px;text-align:center;z-index:200;pointer-events:none}
#title{display:inline-block;font:900 104px/1 Orbitron,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#fff;
 text-shadow:-4px 0 var(--pink),4px 0 var(--cyan),0 0 28px rgba(255,43,214,.8),0 0 60px rgba(0,240,255,.5);animation:glitch 5s steps(1) infinite}
@keyframes glitch{0%,92%,100%{transform:none;clip-path:none}93%{transform:translate(6px,-2px) skewX(-8deg);clip-path:inset(10% 0 45% 0)}95%{transform:translate(-8px,2px);clip-path:inset(55% 0 5% 0)}97%{transform:translate(3px,0)}}
#count{display:inline-flex;gap:14px;align-items:center;margin-top:22px;padding:10px 28px;font:700 38px/1 "Chakra Petch",sans-serif;
 text-transform:uppercase;letter-spacing:3px;background:rgba(5,3,10,.82);border:2px solid var(--cyan);
 clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);box-shadow:inset 0 0 24px rgba(0,240,255,.35)}
#count b{color:var(--acid);text-shadow:0 0 14px var(--acid);font-family:Orbitron}
#count i{width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
body.notitle #head{display:none}
.row{position:absolute;left:0;width:1920px}
.step{position:absolute;left:0;right:0;background:linear-gradient(#141026,#07050f 70%);border-top:3px solid var(--c);box-shadow:0 -2px 18px var(--c)}
.seat{position:absolute}
.seat>svg.chair{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
.fan{position:absolute;left:2.5%;width:95%;bottom:8%;transform-origin:50% 100%}
.fan svg{display:block;width:100%;height:auto;overflow:visible}
.fan.in{animation:warp 1s steps(12) both}
.fan.hop{animation:hop .5s ease-out}
.fan.out{animation:derez .6s steps(6) both}
.fan.lurk svg{opacity:.5;filter:grayscale(1) sepia(1) hue-rotate(140deg) saturate(5)}
.fan.lurk{animation:flicker 7s steps(1) infinite}
.fan.lurk.in{animation:warp 1s steps(12) both}
@keyframes warp{0%{clip-path:inset(0 0 100% 0);opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1.2)}50%{transform:translateX(4%) skewX(-10deg)}60%{transform:none}100%{clip-path:inset(-60% -40% -10% -40%);transform:none}}
@keyframes hop{40%{transform:translateY(-20%) scaleY(1.06)}70%{transform:scaleY(.94)}}
@keyframes derez{to{clip-path:inset(100% 0 0 0);opacity:0;transform:scaleX(1.4)}}
@keyframes flicker{0%,100%{opacity:1}61%{opacity:.4}62%{opacity:1}88%{opacity:.6}89%{opacity:1}}
.beam{position:absolute;left:10%;width:80%;bottom:20%;height:900px;pointer-events:none;z-index:4;
 background:linear-gradient(transparent,var(--c) 70%,#fff);opacity:0;mix-blend-mode:screen;animation:beam 1.1s ease-out both}
@keyframes beam{0%{opacity:0;transform:scaleX(.1)}20%{opacity:.9;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.05)}}
.tag{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);max-width:124%;padding:.18em .5em .1em;
 background:rgba(5,3,10,.88);border:.1em solid var(--c,var(--cyan));color:#fff;font-weight:700;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;line-height:1.05;letter-spacing:.3px;text-shadow:0 0 .4em var(--c,var(--cyan));
 clip-path:polygon(.35em 0,100% 0,100% calc(100% - .35em),calc(100% - .35em) 100%,0 100%,0 .35em)}
.lurk .tag{color:#aef;border-style:dashed;background:rgba(5,3,10,.6)}
.burst{position:absolute;left:50%;bottom:108%;transform:translateX(-50%);z-index:5;pointer-events:none;
 padding:.35em .75em .25em;background:rgba(8,4,20,.92);border:.08em solid var(--pink);color:#fff;white-space:nowrap;
 font:700 var(--fs) "Chakra Petch",sans-serif;box-shadow:0 0 .6em rgba(255,43,214,.7);animation:pop 4.2s ease both;max-width:380px;
 overflow:hidden;text-overflow:ellipsis;clip-path:polygon(.5em 0,100% 0,100% calc(100% - .5em),calc(100% - .5em) 100%,0 100%,0 .5em)}
.burst.hi{border-color:var(--cyan);box-shadow:0 0 .6em rgba(0,240,255,.7);color:var(--cyan)}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scaleY(0)}6%{opacity:1;transform:translateX(-46%) scaleY(1.2)}10%,88%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translateX(-50%) translateY(-24px)}}
#warn{position:absolute;right:16px;bottom:12px;z-index:300;padding:6px 12px;font:700 18px "Chakra Petch";background:#2a0010;border:2px solid #ff3355;color:#ff8899;display:none}
#hud{position:fixed;left:12px;bottom:12px;z-index:999;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 24px);
 padding:10px;background:rgba(8,4,20,.94);border:2px solid var(--cyan);box-shadow:0 0 18px rgba(0,240,255,.4);font:15px/1.3 "Chakra Petch",system-ui}
#hud button{min-height:40px;padding:0 14px;font:700 16px "Chakra Petch",sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--ink);
 background:var(--cyan);border:0;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#hud button.ghost{background:var(--pink)}
#hud button:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
#hud .st{padding:0 6px;color:#cfe}
body.nohud #hud{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="stage">
 <div id="bg"><div class="beamL"></div><div class="beamR"></div><svg id="city" viewBox="0 0 1920 520" aria-hidden="true"></svg></div>
 <div id="head"><div id="title">Le match va commencer</div><br><div id="count"><i></i><span><b>0</b> <span id="cl">supporter connecté</span></span></div></div>
 <div id="rows"></div>
 <div id="rain"></div>
 <div id="warn"></div>
</div>
<div id="hud">
 <button id="b1">+1 supporter</button>
 <button id="b10">+10</button>
 <button id="bl" class="ghost">+5 silencieux</button>
 <button id="bm">Faire parler</button>
 <button id="bd" class="ghost">Démo auto : ON</button>
 <button id="bx" class="ghost">Vider</button>
 <span class="st" id="st">Mode démo</span>
</div>
<script>
{
/* ---------- paramètres : ?channel=xxx (le jeton Twitch va après #token=...) ---------- */
const P=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,''));
const channel=(P.get('channel')||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
const token=(P.get('token')||'').replace(/[^a-z0-9]/gi,'');
const CLIENT_ID=(P.get('client_id')||'').replace(/[^a-z0-9]/gi,'');
const demo=P.has('demo')?P.get('demo')!=='0':!channel;
const showMsg=P.get('messages')!=='0';
const ignore=new Set((P.get('ignore')||'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot,soundalerts,sery_bot,commanderroot').toLowerCase().split(','));
if(channel)ignore.add(channel);
if(P.get('bg')==='0')document.body.classList.add('clear');
if(P.get('rain')==='0')document.body.classList.add('norain');
if(P.get('hud')==='0'||(channel&&!P.has('hud')))document.body.classList.add('nohud');
if(P.has('title')){const t=P.get('title');if(t==='0')document.body.classList.add('notitle');else document.getElementById('title').textContent=t}

const stage=document.getElementById('stage');
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`};
addEventListener('resize',fit);fit();

const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=seed=>()=>{seed=Math.imul(seed^seed>>>15,seed|1);seed^=seed+Math.imul(seed^seed>>>7,seed|61);return((seed^seed>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- skyline sous la pluie ---------- */
{const R=rng(42),NEON=['#00f0ff','#ff2bd6','#8a5cff','#e8ff3a','#ff9a3c'];let s='',x=-20;
 for(let layer=0;layer<2;layer++){x=-20;while(x<1940){const w=50+R()*110,h=(layer?110:180)+R()*(layer?190:230),y=520-h,f=layer?'#120a26':'#0c0719';
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  if(layer){for(let wy=y+12;wy<500;wy+=16)for(let wx=x+8;wx<x+w-10;wx+=13)if(R()<.18)s+=`<rect x="${wx}" y="${wy}" width="6" height="8" fill="${NEON[Math.floor(R()*NEON.length)]}" opacity="${(.35+R()*.5).toFixed(2)}"/>`;
   if(R()<.22){const c=NEON[Math.floor(R()*3)];s+=`<rect x="${x+8}" y="${y+20}" width="${w-16}" height="${18+R()*30}" fill="none" stroke="${c}" stroke-width="3" opacity=".9"/><rect x="${x+8}" y="${y+20}" width="${w-16}" height="10" fill="${c}" opacity=".25"/>`}
   if(R()<.3)s+=`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y-30}" stroke="#2b1f4a" stroke-width="3"/><circle cx="${x+w/2}" cy="${y-32}" r="3" fill="#ff2b4a"/>`}
  x+=w+(layer?6:-10)}}
 document.getElementById('city').innerHTML=s}

/* ---------- gradins ---------- */
const SEATC=['#00f0ff','#00f0ff','#00f0ff','#ff2bd6','#ff2bd6','#8a5cff','#8a5cff','#e8ff3a','#3a3354','#3a3354'];
const chairSVG=(c,n)=>`<svg class="chair" viewBox="0 0 100 80" preserveAspectRatio="none">
<path d="M9 8Q50-3 91 8L86 70Q50 79 14 70Z" fill="#17122b" stroke="#05030a" stroke-width="5" stroke-linejoin="round"/>
<path d="M14 66Q50 74 86 66L86 70Q50 79 14 70Z" fill="#05030a" opacity=".6"/>
<path d="M11 9Q50-1 89 9" fill="none" stroke="${c}" stroke-width="10" opacity=".25" stroke-linecap="round"/>
<path d="M11 9Q50-1 89 9" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>
<path d="M20 18Q34 14 46 15L43 34Q30 34 22 38Z" fill="#fff" opacity=".06"/>
<text x="50" y="30" font-size="11" text-anchor="middle" font-family="Orbitron,monospace" font-weight="700" fill="${c}" opacity=".85">${String(n).padStart(2,'0')}</text></svg>`;
const ROWS=8,seats=[],rowsEl=document.getElementById('rows'),geo=[];
for(let r=0;r<ROWS;r++){const s=.52+r*(.6/(ROWS-1));const w=122*s;geo.push({s,w,h:w*.8})}
let y=0;geo.forEach((g,r)=>{y+=r?g.w*1.02:0;g.b=y});
const shift=1072-geo[ROWS-1].b;
geo.forEach((g,r)=>{
 g.b+=shift;
 const row=document.createElement('div');row.className='row';row.style.zIndex=10+r;row.style.top=(g.b-g.h)+'px';row.style.height=(g.h*2)+'px';
 const step=document.createElement('div');step.className='step';step.style.top=(g.h*.86)+'px';step.style.height=(g.h*1.2)+'px';
 step.style.setProperty('--c',['#00f0ff','#ff2bd6','#8a5cff'][r%3]);
 const gap=g.w*.06,pitch=g.w+gap,n=Math.floor((1920+pitch*.5)/pitch)+1;
 const off=(1920-(n*pitch-gap))/2+(r%2?pitch/2:0)-pitch/4;
 const R=rng(r*7919+13);let html='';
 for(let i=0;i<n;i++){const x=off+i*pitch;if(x<-g.w*.6||x>1920-g.w*.4)continue;
  const c=SEATC[Math.floor(R()*SEATC.length)];seats.push({row:r,x,g,el:null,user:null});
  html+=`<div class="seat" data-i="${seats.length-1}" style="left:${x}px;top:0;width:${g.w}px;height:${g.h}px">${chairSVG(c,i+1)}</div>`}
 row.innerHTML=html;row.prepend(step);rowsEl.appendChild(row)});
document.querySelectorAll('.seat').forEach(el=>seats[+el.dataset.i].el=el);

/* ---------- apparence des supporters ----------
   Un « look » est un objet simple. Aujourd'hui il est tiré du pseudo ; plus tard, le site
   de personnalisation fournira les choix du viewer et ils remplaceront ces valeurs. */
const SKIN=['#ffd9b8','#f1bd8e','#d99a6c','#b07650','#82502f','#5a3620'];
const NEON=['#00f0ff','#ff2bd6','#8a5cff','#e8ff3a','#ff9a3c','#3dff8f'];
const JACKET=['#1b1530','#241a40','#0f1f2b','#2a0f24','#14141c'];
const HAIRC=['#0e0b14','#3b2416','#e9e4ff','#ff2bd6','#00f0ff','#8a5cff','#e8ff3a'];
const OPTIONS={hair:['crete','undercut','carre','rase','capuche','casquette'],eyes:['normaux','visiere','implant'],mouth:['sourire','grand','neutre','masque'],extra:['aucun','casque','aucun','tatouage']};
const customLooks={}; // login -> {hair:'crete', neon:'#ff2bd6', ...} (rempli par le futur site)
function defaultLook(login){const R=rng(hash(login)),pick=a=>a[Math.floor(R()*a.length)];
 return{skin:pick(SKIN),neon:pick(NEON),jacket:pick(JACKET),hairColor:pick(HAIRC),hair:pick(OPTIONS.hair),eyes:pick(OPTIONS.eyes),mouth:pick(OPTIONS.mouth),extra:pick(OPTIONS.extra),num:1+Math.floor(R()*98)}}
const getLook=login=>Object.assign(defaultLook(login),customLooks[login]||{});
function fanSVG(L,name){
 const O='stroke="#05030a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"',n=L.neon,hc=L.hairColor;
 const hair={
  crete:`<path d="M40 22L44 2L50 16L56 0L60 22Q50 18 40 22Z" fill="${n}" ${O}/><path d="M26 44Q24 24 40 20Q50 18 60 20Q76 24 74 44Q70 32 50 30Q30 32 26 44Z" fill="#2a2338" ${O}/>`,
  undercut:`<path d="M24 46Q18 14 52 12Q82 14 78 38Q66 22 44 30Q30 34 24 46Z" fill="${hc}" ${O}/><path d="M60 18L80 34" stroke="${n}" stroke-width="3"/>`,
  carre:`<path d="M22 58Q14 12 50 12Q86 12 78 58L70 58Q72 30 50 28Q28 30 30 58Z" fill="${hc}" ${O}/><path d="M24 50Q22 40 26 32" stroke="${n}" stroke-width="2.5" fill="none"/>`,
  rase:`<path d="M25 40Q26 18 50 17Q74 18 75 40Q64 28 50 28Q36 28 25 40Z" fill="${hc}" opacity=".85" ${O}/>`,
  capuche:`<path d="M14 80Q8 10 50 8Q92 10 86 80L74 78Q80 30 50 28Q20 30 26 78Z" fill="${L.jacket}" ${O}/><path d="M22 74Q18 22 50 16Q82 22 78 74" fill="none" stroke="${n}" stroke-width="3"/>`,
  casquette:`<path d="M24 38Q24 14 50 14Q76 14 76 38Z" fill="#14101e" ${O}/><path d="M48 36L94 40Q92 46 76 44Z" fill="#14101e" ${O}/><path d="M28 36H74" stroke="${n}" stroke-width="3"/><circle cx="50" cy="24" r="3.5" fill="${n}"/>`}[L.hair];
 const eyes={
  normaux:`<ellipse cx="39" cy="46" rx="5" ry="6" fill="#fff" ${O} stroke-width="2.5"/><ellipse cx="61" cy="46" rx="5" ry="6" fill="#fff" ${O} stroke-width="2.5"/><circle cx="40" cy="47" r="2.6" fill="${n}"/><circle cx="62" cy="47" r="2.6" fill="${n}"/><circle cx="40" cy="47" r="1.1" fill="#05030a"/><circle cx="62" cy="47" r="1.1" fill="#05030a"/>`,
  visiere:`<path d="M22 40Q50 34 78 40L76 54Q50 50 24 54Z" fill="${n}" opacity=".9" ${O}/><path d="M28 43Q50 39 72 43" stroke="#fff" stroke-width="2" opacity=".8" fill="none"/>`,
  implant:`<ellipse cx="39" cy="46" rx="5" ry="6" fill="#fff" ${O} stroke-width="2.5"/><circle cx="40" cy="47" r="2.4" fill="#05030a"/><circle cx="61" cy="46" r="8" fill="#14101e" ${O} stroke-width="2.5"/><circle cx="61" cy="46" r="4.5" fill="none" stroke="${n}" stroke-width="2.5"/><circle cx="61" cy="46" r="1.6" fill="#fff"/><path d="M69 46H76M61 54V62" stroke="${n}" stroke-width="2"/>`}[L.eyes];
 const mouth={sourire:`<path d="M41 61Q50 68 59 61" fill="none" ${O} stroke-width="3"/>`,
  grand:`<path d="M39 59Q50 72 61 59Z" fill="#2a0618" ${O} stroke-width="3"/><path d="M42 60H58" stroke="#fff" stroke-width="2.5"/>`,
  neutre:`<path d="M43 63H57" ${O} stroke-width="3"/>`,
  masque:`<path d="M28 56Q50 52 72 56L68 72Q50 80 32 72Z" fill="#14101e" ${O}/><path d="M36 62H64M38 67H62" stroke="${n}" stroke-width="2.5" stroke-dasharray="3 3"/>`}[L.mouth];
 const extra={aucun:'',
  casque:`<path d="M20 50Q18 16 50 14Q82 16 80 50" fill="none" stroke="#14101e" stroke-width="5"/><rect x="15" y="42" width="10" height="18" rx="4" fill="#14101e" ${O} stroke-width="2.5"/><rect x="75" y="42" width="10" height="18" rx="4" fill="#14101e" ${O} stroke-width="2.5"/><path d="M18 46V56M82 46V56" stroke="${n}" stroke-width="2.5"/>`,
  tatouage:`<path d="M30 52L34 58L30 64M70 52L66 58L70 64" fill="none" stroke="${n}" stroke-width="2"/>`}[L.extra];
 return `<svg viewBox="0 0 100 118" aria-label="${esc(name)}">
<path d="M8 118Q8 80 50 78Q92 80 92 118Z" fill="${L.jacket}" ${O}/>
<path d="M50 80L50 118M30 84Q40 100 38 118M70 84Q60 100 62 118" stroke="${n}" stroke-width="2.5" fill="none" opacity=".9"/>
<path d="M30 82Q50 94 70 82L66 78Q50 86 34 78Z" fill="#05030a"/>
<text x="76" y="110" font-size="11" text-anchor="middle" fill="${n}" font-family="Orbitron,monospace" font-weight="900">${L.num}</text>
<path d="M41 70V82Q50 87 59 82V70Z" fill="${L.skin}" ${O}/>
<ellipse cx="50" cy="47" rx="26" ry="28" fill="${L.skin}" ${O}/>
<path d="M66 24Q78 40 72 62" stroke="${n}" stroke-width="2.5" fill="none" opacity=".75"/>
${hair}${eyes}${L.hair!=='capuche'&&L.eyes!=='visiere'?`<path d="M32 37L44 35M56 35L68 37" ${O} stroke-width="2.5"/>`:''}${mouth}${extra}</svg>`;
}

/* ---------- arrivée / départ ---------- */
const crowd=new Map(); // login -> {seat,last,lurk,name}
const countB=document.querySelector('#count b'),countL=document.getElementById('cl');
const updateCount=()=>{countB.textContent=crowd.size;countL.textContent=crowd.size>1?'supporters connectés':'supporter connecté'};
function bubble(seat,text,hi){seat.el.querySelector('.burst')?.remove();
 const b=document.createElement('div');b.className='burst'+(hi?' hi':'');b.textContent=text;b.style.setProperty('--fs',Math.max(17,seat.g.w*.2)+'px');
 seat.el.appendChild(b);setTimeout(()=>b.remove(),4300)}
function freeSeat(lurk){const empty=seats.filter(s=>!s.user);
 if(empty.length){const score=s=>s.row*2.2-Math.abs(s.x+s.g.w/2-960)/260+Math.random()*3+(lurk?-s.row*3:0); // les silencieux remplissent plutôt l'arrière
  return empty.sort((a,b)=>score(b)-score(a))[0]}
 let old=null;for(const [k,v] of crowd)if(!old||(v.lurk&&!old[1].lurk)||(v.lurk===old[1].lurk&&v.last<old[1].last))old=[k,v];
 if(lurk&&!old[1].lurk)return null; // un silencieux ne prend jamais la place de quelqu'un qui parle
 leave(old[0]);return old[1].seat}
function leave(login){const f=crowd.get(login);if(!f)return;crowd.delete(login);
 const el=f.seat.el.querySelector('.fan');f.seat.user=null;f.seat.el.style.zIndex='';
 if(el){el.className='fan out';setTimeout(()=>el.remove(),600)}updateCount();save()}
function arrive(login,display,o={}){
 login=login.toLowerCase();if(!login||ignore.has(login))return;
 const f=crowd.get(login),lurk=!!o.lurk;
 if(f){if(lurk){f.seen=Date.now();return}
  f.last=f.seen=Date.now();const el=f.seat.el.querySelector('.fan');
  if(f.lurk){f.lurk=false;el.classList.remove('lurk');beam(f.seat,f.look.neon);bubble(f.seat,f.name,true)} // l'hologramme devient solide
  el.classList.remove('in','hop');void el.offsetWidth;el.classList.add('hop');
  if(o.color)el.querySelector('.tag').style.setProperty('--c',o.color);
  if(showMsg&&o.msg)bubble(f.seat,o.msg.length>48?o.msg.slice(0,46)+'…':o.msg);save();return}
 const seat=freeSeat(lurk);if(!seat)return;seat.user=login;
 const look=getLook(login),name=display||login;
 const fan=document.createElement('div');fan.className='fan in'+(lurk?' lurk':'');fan.innerHTML=fanSVG(look,name);
 const tag=document.createElement('div');tag.className='tag';tag.textContent=name;tag.style.fontSize=Math.max(12,seat.g.w*.17)+'px';
 tag.style.setProperty('--c',o.color||look.neon);fan.appendChild(tag);seat.el.appendChild(fan);seat.el.style.zIndex=2;
 setTimeout(()=>fan.classList.remove('in'),1100);
 if(!o.quiet)beam(seat,look.neon);
 crowd.set(login,{seat,last:lurk?0:Date.now(),seen:Date.now(),lurk,name,look});updateCount();
 if(!lurk&&!o.quiet)setTimeout(()=>bubble(seat,name,true),500);
 if(!lurk&&showMsg&&o.msg)setTimeout(()=>bubble(seat,o.msg.length>48?o.msg.slice(0,46)+'…':o.msg),2600);
 save()}
function beam(seat,c){const b=document.createElement('div');b.className='beam';b.style.setProperty('--c',c);seat.el.appendChild(b);setTimeout(()=>b.remove(),1200)}

/* ---------- mémoire entre Starting et Ending (6 h) ---------- */
const KEY='tribune2:'+(channel||'demo');let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),u:[...crowd].map(([k,v])=>[k,v.name,v.lurk])}))}catch(e){}},500)}
try{if(P.get('reset')==='1')localStorage.removeItem(KEY);const d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d&&Date.now()-d.t<6*3600e3&&!demo)d.u.forEach(([l,n,lk],i)=>setTimeout(()=>arrive(l,n,{lurk:lk,quiet:true}),i*40))}catch(e){}

/* ---------- chat Twitch anonyme (IRC WebSocket) ---------- */
const st=document.getElementById('st'),warn=document.getElementById('warn');
function connect(delay=1000){let ws;try{ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443')}catch(e){st.textContent='Connexion impossible ici';return}
 ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'+(P.get('lurkers')==='irc'?' twitch.tv/membership':''));
  ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(1e4+Math.random()*8e4));ws.send('JOIN #'+channel);st.textContent='Connecté à #'+channel;delay=1000};
 ws.onmessage=e=>e.data.split('\r\n').forEach(line=>{if(!line)return;if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return}
  let tags={},rest=line;if(rest[0]==='@'){const sp=rest.indexOf(' ');rest.slice(1,sp).split(';').forEach(kv=>{const i=kv.indexOf('=');tags[kv.slice(0,i)]=kv.slice(i+1)});rest=rest.slice(sp+1)}
  const m=rest.match(/^:([^!]+)!\S+ (PRIVMSG|JOIN|PART) #\S+(?: :(.*))?$/);if(!m)return;
  if(m[2]==='PRIVMSG')arrive(m[1],tags['display-name']||m[1],{color:tags.color,msg:m[3]});
  else if(m[2]==='JOIN')arrive(m[1],m[1],{lurk:true});
  else {const f=crowd.get(m[1]);if(f&&f.lurk)leave(m[1])}});
 ws.onclose=()=>{st.textContent='Reconnexion…';setTimeout(()=>connect(Math.min(delay*2,30000)),delay)}}
if(channel)connect();

/* ---------- viewers silencieux : API Twitch « Get Chatters » (jeton du streamer) ---------- */
async function helix(path){const r=await fetch('https://api.twitch.tv/helix/'+path,{headers:{Authorization:'Bearer '+token,'Client-Id':CLIENT_ID}});
 if(r.status===401)throw new Error('expired');if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function pollChatters(){
 try{const me=(await helix('users')).data[0];let all=[],cursor='';
  do{const j=await helix(`chat/chatters?broadcaster_id=${me.id}&moderator_id=${me.id}&first=1000${cursor?'&after='+cursor:''}`);
   all=all.concat(j.data);cursor=j.pagination&&j.pagination.cursor||''}while(cursor&&all.length<3000);
  const now=Date.now(),here=new Set(all.map(c=>c.user_login));
  all.forEach((c,i)=>setTimeout(()=>arrive(c.user_login,c.user_name,{lurk:true}),Math.min(i*120,20000)));
  for(const [k,v] of crowd)if(v.lurk&&!here.has(k)&&now-v.seen>150e3)leave(k); // parti depuis plus de 2 min 30
  warn.style.display='none';setTimeout(pollChatters,60e3)}
 catch(e){warn.style.display='block';warn.textContent=e.message==='expired'?'Jeton Twitch expiré : reconnecte-toi sur la page connect':'API Twitch indisponible, nouvel essai dans 2 min';
  if(e.message!=='expired')setTimeout(pollChatters,120e3)}}
if(channel&&token&&CLIENT_ID)pollChatters();
